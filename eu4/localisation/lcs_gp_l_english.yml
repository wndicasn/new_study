 lcs_gp.40.t:0 "波兰 · 翼骑兵"
 lcs_gp.40.d:0 "维也纳城下，羽翼与长枪一同张开。重骑兵最后的辉煌属于波兰，也只在波兰。"
 lcs_gp.40.a:0 "联邦的荣耀不容侵犯。"
