 lcs_gp.43.t:0 "波兰 · 四年的瑟姆"
 lcs_gp.43.d:0 "欧洲第一部成文宪法在 Warsaw 通过。改革与瓜分在同一张桌子上赛跑，而时间不在联邦这一边。"
 lcs_gp.43.a:0 "联邦的荣耀不容侵犯。"
