 lcs_gp.50.t:0 "勃兰登堡 · 选侯的军队"
 lcs_gp.50.d:0 "贫瘠的沙地与分散的领地，让勃兰登堡只能靠一支常备军撑住场面。霍亨索伦家的算盘很简单：先站住，再往前走。"
 lcs_gp.50.a:0 "选侯的军队，先要活下去。"
 lcs_bra_1:0 "勃兰登堡 · 选侯的军队"
 desc_lcs_bra_1:0 "陆军士气 +10%；训练度 +5%；人力恢复 +15%；侵略扩张影响 -20%；改善关系 +15%"
 lcs_gp.51.t:0 "勃兰登堡 · 霍亨索伦的家业"
 lcs_gp.51.d:0 "宗教改革的风从维滕贝格吹出，选侯把教会的地产收进自己的账册。北德的诸侯还在观望，勃兰登堡已经在扩军。"
 lcs_gp.51.a:0 "选侯的军队，先要活下去。"
