 lcs_gp.44.t:0 "波兰 · 民族之春"
 lcs_gp.44.d:0 "军团在流亡中高唱《波兰没有灭亡》。国家可以亡，民族不会——这份执念最终会换来一个国家。"
 lcs_gp.44.a:0 "联邦的荣耀不容侵犯。"
