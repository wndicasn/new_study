 lcs_gp.41.t:0 "波兰 · 黄金自由"
 lcs_gp.41.d:0 "贵族共和强盛一时，选举君主与自由否决权让联邦成为欧洲最自由的国家，也让它成为最难统治的国家。"
 lcs_gp.41.a:0 "联邦的荣耀不容侵犯。"
