 lcs_gp.45.t:0 "瑞典 · 铜与铁"
 lcs_gp.45.d:0 "法伦的铜矿与达拉纳的铁，让这个北方小国第一次有了打仗的本钱。"
 lcs_gp.45.a:0 "北方的雄狮已经醒来。"
