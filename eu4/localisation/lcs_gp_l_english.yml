 lcs_gp.49.t:0 "瑞典 · 贝尔纳多特"
 lcs_gp.49.d:0 "一位法国元帅成了瑞典的王储，旧王朝在炮声中落幕，新王朝带着拿破仑的操典走上战场。"
 lcs_gp.49.a:0 "北方的雄狮已经醒来。"
