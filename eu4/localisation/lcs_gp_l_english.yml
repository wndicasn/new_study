 lcs_gp.46.d:0 "炮兵、骑兵与步兵被编成一台会跳舞的杀人机器：小型战术单位、齐射与机动，欧洲战争从此改写法。"
 lcs_gp.46.a:0 "北方的雄狮已经醒来。"
