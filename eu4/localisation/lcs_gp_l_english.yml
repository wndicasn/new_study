 lcs_gp.55.t:0 "普鲁士 · 腓特烈的斜线战术"
 lcs_gp.55.d:0 "斜线战术：以少打多，靠的是操练、纪律与速度。军队成了国王的手艺，而邻国开始把普鲁士的每一次扩军都记在账上。"
 lcs_gp.55.a:0 "纪律就是一切。"
