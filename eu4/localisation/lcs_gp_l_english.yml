l_english:
 lcs_gp.1.t:0 "法兰西 · 百年战争的余烬"
 lcs_gp.1.d:0 "鲁昂与波尔多的硝烟散尽。被战火犁过二十年的土地上，骑士、自由弓手与王室的军械官第一次站在同一面王旗下——法兰西的军队不再只为封臣而战。"
 lcs_gp.1.a:0 "王国的意志不容置疑。"
 lcs_fra_1:0 "法兰西 · 百年战争的余烬"
 desc_lcs_fra_1:0 "陆军士气 +10%；人力恢复 +10%"
 lcs_gp.2.t:0 "法兰西 · 意大利战争"
 lcs_gp.2.d:0 "查理八世跨过阿尔卑斯山。意大利的富庶与分裂让法兰西看清了一件事：决定战场的不再是骑士的冲锋，而是纪律严明的步兵方阵与重炮。"
 lcs_gp.2.a:0 "王国的意志不容置疑。"
 lcs_fra_2:0 "法兰西 · 意大利战争"
 desc_lcs_fra_2:0 "步兵战斗力 +10%；陆军上限 +10%"
 lcs_gp.3.t:0 "法兰西 · 太阳王的宫廷"
 lcs_gp.3.d:0 "凡尔赛的镜厅里，法语取代拉丁语成为欧洲宫廷的语言。太阳王的荣耀就是法兰西的荣耀，而荣耀需要一场永不落幕的阅兵。"
 lcs_gp.3.a:0 "王国的意志不容置疑。"
 lcs_fra_3:0 "法兰西 · 太阳王的宫廷"
 desc_lcs_fra_3:0 "训练度 +5%；每年威望 +0.5；行政维护 -5%"
 lcs_gp.4.t:0 "法兰西 · 启蒙的沙龙"
 lcs_gp.4.d:0 "沙龙、百科全书与《论法的精神》。伏尔泰与卢梭的笔，比任何一支军队攻城更快——思想正在成为这个国家最锋利的武器。"
 lcs_gp.4.a:0 "王国的意志不容置疑。"
 lcs_fra_4:0 "法兰西 · 启蒙的沙龙"
 desc_lcs_fra_4:0 "科技花费 -10%；理念花费 -10%"
 lcs_gp.5.t:0 "法兰西 · 大军团"
 lcs_gp.5.d:0 "大革命给了每个人一个理由去死，拿破仑给了他们一套编制去赢。全民征兵、师级纵队与荣誉感，把整个国家变成了一座军营。"
 lcs_gp.5.a:0 "王国的意志不容置疑。"
 lcs_fra_5:0 "法兰西 · 大军团"
 desc_lcs_fra_5:0 "陆军士气 +15%；训练度 +10%；人力恢复 +10%"
 lcs_gp.6.t:0 "不列颠 · 都铎的舰炮"
 lcs_gp.6.d:0 "泰晤士河口的船坞昼夜不歇，长弓退场，舷侧炮登场。谁能控制海峡，谁就能决定这个岛国的命运。"
 lcs_gp.6.a:0 "海权即国运。"
 lcs_gbr_1:0 "不列颠 · 都铎的舰炮"
 desc_lcs_gbr_1:0 "海军士气 +10%；船只耐久 +5%"
 lcs_gp.7.t:0 "不列颠 · 皇家海军"
 lcs_gp.7.d:0 "朴茨茅斯的龙骨一艘接一艘下水。两强标准不是野心，是国策——海军的账本比陆军的战报更长。"
 lcs_gp.7.a:0 "海权即国运。"
 lcs_gbr_2:0 "不列颠 · 皇家海军"
 desc_lcs_gbr_2:0 "海军上限 +15%；船只耐久 +10%；海军士气 +5%"
 lcs_gp.8.t:0 "不列颠 · 光荣革命"
 lcs_gp.8.d:0 "国王被议会赶走之后，英格兰银行与国债让伦敦的信用比任何王冠都值钱。战争从此由债券而不是税收来打。"
 lcs_gp.8.a:0 "海权即国运。"
 lcs_gbr_3:0 "不列颠 · 光荣革命"
 desc_lcs_gbr_3:0 "贷款利息 -1；贸易效率 +10%"
 lcs_gp.9.t:0 "不列颠 · 联合王国的工场"
 lcs_gp.9.d:0 "曼彻斯特的纺织机昼夜不停，煤与铁把乡野变成了工场。财富第一次不再来自土地，而来自蒸汽与齿轮。"
 lcs_gp.9.a:0 "海权即国运。"
 lcs_gbr_4:0 "不列颠 · 联合王国的工场"
 desc_lcs_gbr_4:0 "生产效率 +10%；科技花费 -5%"
 lcs_gp.10.t:0 "不列颠 · 工业革命"
 lcs_gp.10.d:0 "蒸汽机轰鸣，铁路把内陆与港口缝在一起。世界工厂不需要殖民地来卖货，它需要殖民地来买货。"
 lcs_gp.10.a:0 "海权即国运。"
 lcs_gbr_5:0 "不列颠 · 工业革命"
 desc_lcs_gbr_5:0 "生产效率 +15%；贸易效率 +10%；贸易竞争力 +10%"
 lcs_gp.11.t:0 "西班牙 · 收复失地的余晖"
 lcs_gp.11.d:0 "格拉纳达陷落，半岛上最后一面新月旗降下。十字架与战马成就了卡斯蒂利亚的军魂，也成就了一个刚刚统一的王国。"
 lcs_gp.11.a:0 "为了黄金、上帝与荣耀。"
 lcs_spa_1:0 "西班牙 · 收复失地的余晖"
 desc_lcs_spa_1:0 "陆军士气 +5%；传教强度 +2%"
 lcs_gp.12.t:0 "西班牙 · 征服者"
 lcs_gp.12.d:0 "科尔特斯与皮萨罗的船队驶向未知的西海岸。帝国的边界不由条约划定，而由征服者的靴子划定。"
 lcs_gp.12.a:0 "为了黄金、上帝与荣耀。"
 lcs_spa_2:0 "西班牙 · 征服者"
 desc_lcs_spa_2:0 "殖民范围 +20%；殖民者 +1 名"
 lcs_gp.13.t:0 "西班牙 · 白银帝国"
 lcs_gp.13.d:0 "波托西的白银经塞维利亚流入欧洲，西班牙的旗帜插满两大洲。代价是本土的工场一片荒芜，而没人愿意承认这一点。"
 lcs_gp.13.a:0 "为了黄金、上帝与荣耀。"
 lcs_spa_3:0 "西班牙 · 白银帝国"
 desc_lcs_spa_3:0 "贸易效率 +10%；每年威望 +0.5"
 lcs_gp.14.t:0 "西班牙 · 波旁改革"
 lcs_gp.14.d:0 "波旁王朝的官吏丈量土地、整顿税册、重编舰队。衰落并非不可逆转，只要账本还在王室手里。"
 lcs_gp.14.a:0 "为了黄金、上帝与荣耀。"
 lcs_spa_4:0 "西班牙 · 波旁改革"
 desc_lcs_spa_4:0 "建筑花费 -10%；发展成本 -5%；税收 +5%"
 lcs_gp.15.t:0 "西班牙 · 加的斯的议会"
 lcs_gp.15.d:0 "拿破仑的军队踏破国门，加的斯的议会却在炮火中写下了第一部宪法。帝国失去了美洲，却开始重新定义自己。"
 lcs_gp.15.a:0 "为了黄金、上帝与荣耀。"
 lcs_spa_5:0 "西班牙 · 加的斯的议会"
 desc_lcs_spa_5:0 "稳定花费 -10%；行政效率 +5%"
 lcs_gp.16.t:0 "奥斯曼 · 加齐的弯刀"
 lcs_gp.16.d:0 "君士坦丁堡的城墙在重炮下崩塌。边疆战士的信仰与战利品，就是奥斯曼扩张最原始的燃料。"
 lcs_gp.16.a:0 "帝国仍在，只是慢了半拍。"
 lcs_tur_1:0 "奥斯曼 · 加齐的弯刀"
 desc_lcs_tur_1:0 "陆军士气 +10%；人力恢复 +10%"
 lcs_gp.17.t:0 "奥斯曼 · 苏莱曼的法典"
 lcs_gp.17.d:0 "苏莱曼把土地、税收与军役写进同一部法典。帝国不靠血统运转，靠的是律法与一支领薪水的常备军。"
 lcs_gp.17.a:0 "帝国仍在，只是慢了半拍。"
 lcs_tur_2:0 "奥斯曼 · 苏莱曼的法典"
 desc_lcs_tur_2:0 "训练度 +5%；行政效率 +5%"
 lcs_gp.18.t:0 "奥斯曼 · 苏丹的深宫"
 lcs_gp.18.d:0 "后宫、太监与禁卫军的要挟取代了御驾亲征。舰队在勒班陀折戟，而帝国的账本仍在按旧日的方式计算胜负。"
 lcs_gp.18.a:0 "帝国仍在，只是慢了半拍。"
 lcs_tur_3:0 "奥斯曼 · 苏丹的深宫"
 desc_lcs_tur_3:0 "陆军士气 -5%；科技花费 +5%；税收 -5%"
 lcs_gp.19.t:0 "奥斯曼 · 郁金香与停滞"
 lcs_gp.19.d:0 "郁金香在伊斯坦布尔的花园里盛开，维也纳城下却留下了惨败的印记。西方在按新方法练兵，帝国还在数旧账。"
 lcs_gp.19.a:0 "帝国仍在，只是慢了半拍。"
 lcs_tur_4:0 "奥斯曼 · 郁金香与停滞"
 desc_lcs_tur_4:0 "陆军士气 -10%；训练度 -5%；科技花费 +10%；税收 -10%；全国动乱 +1"
 lcs_gp.20.t:0 "奥斯曼 · 西亚病夫"
 lcs_gp.20.d:0 "希腊独立、埃及失控、列强环伺。疆域还在，但军队、财政与制度一同落在了时代后面。"
 lcs_gp.20.a:0 "帝国仍在，只是慢了半拍。"
 lcs_tur_5:0 "奥斯曼 · 西亚病夫"
 desc_lcs_tur_5:0 "陆军士气 -15%；训练度 -10%；税收 -15%；人力上限 -20%；科技花费 +20%；行政效率 -10%；稳定花费 +20%；全国动乱 +2"
 lcs_gp.21.t:0 "奥地利 · 婚姻外交"
 lcs_gp.21.d:0 "「让别人去打仗吧，你，幸福的奥地利，结婚。」哈布斯堡的婚约比刀剑收获更多，欧洲的地图由嫁妆重新绘制。"
 lcs_gp.21.a:0 "让哈布斯堡继续统治。"
 lcs_hab_1:0 "奥地利 · 婚姻外交"
 desc_lcs_hab_1:0 "外交声望 +1；改善关系 +20%"
 lcs_gp.22.t:0 "奥地利 · 反宗教改革"
 lcs_gp.22.d:0 "耶稣会的教士与特伦托的决议，把帝国的天主教重新钉回原位。信仰的统一，就是领地的统一。"
 lcs_gp.22.a:0 "让哈布斯堡继续统治。"
 lcs_hab_2:0 "奥地利 · 反宗教改革"
 desc_lcs_hab_2:0 "传教强度 +3%；稳定花费 -5%"
 lcs_gp.23.t:0 "奥地利 · 三十年战争"
 lcs_gp.23.d:0 "布拉格的窗口扔出了三个人，也扔出了三十年的血火。维也纳终于明白：要维持帝国，先要有一支能打的常备军。"
 lcs_gp.23.a:0 "让哈布斯堡继续统治。"
 lcs_hab_3:0 "奥地利 · 三十年战争"
 desc_lcs_hab_3:0 "训练度 +5%；人力上限 +10%"
 lcs_gp.24.t:0 "奥地利 · 玛丽亚·特蕾莎的改革"
 lcs_gp.24.d:0 "义务教育、统一税制、新的官僚体系与宫廷军事委员会。一个松散的王朝，正在被改造成一台国家机器。"
 lcs_gp.24.a:0 "让哈布斯堡继续统治。"
 lcs_hab_4:0 "奥地利 · 玛丽亚·特蕾莎的改革"
 desc_lcs_hab_4:0 "税收 +10%；行政效率 +5%"
 lcs_gp.25.t:0 "奥地利 · 梅特涅体系"
 lcs_gp.25.d:0 "维也纳会议之后的欧洲：均势、会议与秘密警察。稳定就是奥地利最大的利益，动荡则是它最大的敌人。"
 lcs_gp.25.a:0 "让哈布斯堡继续统治。"
 lcs_hab_5:0 "奥地利 · 梅特涅体系"
 desc_lcs_hab_5:0 "外交声望 +2；改善关系 +30%"
 lcs_gp.26.t:0 "俄罗斯 · 摆脱枷锁"
 lcs_gp.26.d:0 "乌格拉河畔的僵持结束了两个世纪的臣服。莫斯科终于可以自称第三罗马，而它的底气是无穷无尽的人。"
 lcs_gp.26.a:0 "为了沙皇与祖国。"
 lcs_rus_1:0 "俄罗斯 · 摆脱枷锁"
 desc_lcs_rus_1:0 "人力上限 +15%；人力恢复 +10%"
 lcs_gp.27.t:0 "俄罗斯 · 特辖军"
 lcs_gp.27.d:0 "黑骑在诺夫哥罗德街头驰过。沙皇的意志就是法律，而法律由鞭子与绞架来执行。"
 lcs_gp.27.a:0 "为了沙皇与祖国。"
 lcs_rus_2:0 "俄罗斯 · 特辖军"
 desc_lcs_rus_2:0 "训练度 +5%；全国动乱 -1"
 lcs_gp.28.t:0 "俄罗斯 · 罗曼诺夫王朝"
 lcs_gp.28.d:0 "混乱时代之后，新王朝重建秩序。西伯利亚的毛皮与乌拉尔的盐，换来国库里堆积的白银。"
 lcs_gp.28.a:0 "为了沙皇与祖国。"
 lcs_rus_3:0 "俄罗斯 · 罗曼诺夫王朝"
 desc_lcs_rus_3:0 "治理容量 +10%；税收 +10%"
 lcs_gp.29.t:0 "俄罗斯 · 彼得大帝的西化"
 lcs_gp.29.d:0 "涅瓦河口筑起新都，贵族被剃掉了胡子。海军、学院与工厂一起开张——俄国要用一代人的时间追上欧洲。"
 lcs_gp.29.a:0 "为了沙皇与祖国。"
 lcs_rus_4:0 "俄罗斯 · 彼得大帝的西化"
 desc_lcs_rus_4:0 "科技花费 -10%；训练度 +5%"
 lcs_gp.30.t:0 "俄罗斯 · 1812 年的冬天"
 lcs_gp.30.d:0 "焦土、游击与严寒。大军团在莫斯科的灰烬里化为乌有，而俄国的军队跟进了巴黎。"
 lcs_gp.30.a:0 "为了沙皇与祖国。"
 lcs_rus_5:0 "俄罗斯 · 1812 年的冬天"
 desc_lcs_rus_5:0 "人力恢复 +20%；陆军士气 +10%；人力上限 +10%"
 lcs_gp.31.t:0 "明 · 永乐遗产"
 lcs_gp.31.d:0 "紫禁城的钟声犹在，宝船与朝贡体系撑起了一个以中原为中心的天下。秩序，本身就是最大的财富。"
 lcs_gp.31.a:0 "天朝自有天朝的章法。"
 lcs_mng_1:0 "明 · 永乐遗产"
 desc_lcs_mng_1:0 "税收 +10%；稳定花费 -10%"
 lcs_gp.32.t:0 "明 · 土木之变"
 lcs_gp.32.d:0 "土木堡的惨败让天子成了俘虏，京营精锐覆没。此后的朝堂以太监、党争与内帑为轴心，边患与财政一起松动。"
 lcs_gp.32.a:0 "天朝自有天朝的章法。"
 lcs_mng_2:0 "明 · 土木之变"
 desc_lcs_mng_2:0 "陆军士气 -10%；训练度 -5%；税收 -5%；全国动乱 +1"
 lcs_gp.33.t:0 "明 · 大厦将倾"
 lcs_gp.33.d:0 "万历数十年不朝，辽东的军饷年年拖欠。白银断流、卫所崩坏、党争不休——庞大的帝国正在从内部被蛀空，而关外的马蹄声越来越近。"
 lcs_gp.33.a:0 "天朝自有天朝的章法。"
 lcs_mng_3:0 "明 · 大厦将倾"
 desc_lcs_mng_3:0 "陆军士气 -20%；训练度 -10%；税收 -20%；发展成本 +20%；人力上限 -25%；人力恢复 -30%；稳定花费 +25%；全国动乱 +2；科技花费 +15%；行政效率 -10%；陆军上限 -20%；建筑花费 +15%"
 lcs_gp.34.t:0 "明 · 流寇与南明"
 lcs_gp.34.d:0 "李自成的队伍与关外的铁骑同时压来。京师陷落，江南诸镇各自拥立——正统不再只有一个，而战火没有一天停过。"
 lcs_gp.34.a:0 "天朝自有天朝的章法。"
 lcs_mng_4:0 "明 · 流寇与南明"
 desc_lcs_mng_4:0 "陆军士气 -15%；税收 -20%；全国动乱 +3；行政效率 -15%；人力恢复 -20%"
 lcs_gp.35.t:0 "明 · 天朝残喘"
 lcs_gp.35.d:0 "海疆洞开，白银外流，团练与厘金取代了旧的卫所与户部。帝国还在，但它已经不再能决定自己的命运。"
 lcs_gp.35.a:0 "天朝自有天朝的章法。"
 lcs_mng_5:0 "明 · 天朝残喘"
 desc_lcs_mng_5:0 "税收 -20%；科技花费 +25%；建筑花费 +15%；全国动乱 +3；陆军士气 -10%"
 lcs_gp.36.t:0 "清 · 入关"
 lcs_gp.36.d:0 "山海关的城门打开，八旗的铁骑踏入中原。新王朝接手了旧官僚，也接手了旧难题——但它手里有一支真正能打的军队。"
 lcs_gp.36.a:0 "守成，亦是一种本事。"
 lcs_qng_1:0 "清 · 入关"
 desc_lcs_qng_1:0 "陆军士气 +10%；训练度 +10%；行政效率 +5%"
 lcs_gp.37.t:0 "清 · 康乾盛世"
 lcs_gp.37.d:0 "人口过亿，府库充盈，疆域极盛。皇帝南巡的船队沿着运河一路南下，沿途是百年不遇的太平。"
 lcs_gp.37.a:0 "守成，亦是一种本事。"
 lcs_qng_2:0 "清 · 康乾盛世"
 desc_lcs_qng_2:0 "税收 +15%；发展成本 -15%；建筑花费 -10%；稳定花费 -10%"
 lcs_gp.38.t:0 "清 · 嘉道中衰"
 lcs_gp.38.d:0 "白莲教、鸦片与漕运的亏空一起压来。盛世的账本已经算完，接下来是赔款、条约与割地。"
 lcs_gp.38.a:0 "守成，亦是一种本事。"
 lcs_qng_3:0 "清 · 嘉道中衰"
 desc_lcs_qng_3:0 "税收 -15%；科技花费 +20%；全国动乱 +2；建筑花费 +10%"
 lcs_gp.39.t:0 "满洲 · 八旗"
 lcs_gp.39.d:0 "十三副遗甲起兵，牛录与旗分把渔猎的部族编成了一支军队。骑射、赏罚与一统满洲的野心合在一起，足以撼动中原。"
 lcs_gp.39.a:0 "八旗所向，皆我疆土。"
