 desc_lcs_bra_2:0 "陆军士气 +10%；训练度 +10%；步兵战斗力 +10%；人力上限 +25%；侵略扩张影响 -25%；科技花费 -5%"
 lcs_gp.52.t:0 "勃兰登堡 · 北方的军械库"
 lcs_gp.52.d:0 "如果普鲁士始终没有立起来，勃兰登堡自己就得当那把刀。征兵区、军械所与一支不靠雇佣兵的常备军，把沙地变成了兵营。"
 lcs_gp.52.a:0 "选侯的军队，先要活下去。"
