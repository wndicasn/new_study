 lcs_gp.53.t:0 "普鲁士 · 普鲁士公国"
 lcs_gp.53.d:0 "条顿骑士团的残部世俗化，公国在波罗的海边立起第一支真正意义上的常备军。小国要活下去，只能比大国更早起床。"
 lcs_gp.53.a:0 "纪律就是一切。"
 lcs_pru_1:0 "普鲁士 · 普鲁士公国"
 desc_lcs_pru_1:0 "训练度 +10%；陆军士气 +10%；步兵战斗力 +10%；侵略扩张影响 +10%；最大专制主义 +5；每年正统性 +1"
 lcs_gp.54.t:0 "普鲁士 · 大选帝侯的常备军"
 lcs_gp.54.d:0 "柏林在强国林立中保住了自己的位置——靠的不是疆域，而是一支随时能出动的军队，和一个说了算的宫廷。"
 lcs_gp.54.a:0 "纪律就是一切。"
