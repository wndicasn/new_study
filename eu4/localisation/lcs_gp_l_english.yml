 lcs_gp.42.t:0 "波兰 · 大洪水"
 lcs_gp.42.d:0 "瑞典与俄国的铁蹄踏遍联邦，城市被焚、国库被掠。联邦靠游击、信仰与一点点运气活了下来。"
 lcs_gp.42.a:0 "联邦的荣耀不容侵犯。"
