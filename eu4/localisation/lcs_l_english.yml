l_english:
 lcs.1.t:0 "永恒的恩泽"
 lcs.1.d:0 "一份不知从何处送来的诏书摆在[Root.GetName]的御案上。它没有署名，也没有印玺，只有一行字：\n\n「照着念，然后闭嘴。」\n\n念完之后，国库、工部、边疆与军营同时安静了下来——安静得让人不安。"
 lcs.1.a:0 "念。"
 lcs_cheat_modifier:0 "永恒的恩泽"
 desc_lcs_cheat_modifier:0 "核心化花费 -80%\n分离主义年限 -20\n陆军募兵时间 -50%\n文化转变时间 -90%\n文化转变花费 -80%"
 lcs.3.t:0 "营造改革"
 lcs.3.d:0 "[Root.GetName]的工部与各省督抚同时递上奏疏：旧的营造法度已经撑不住这个时代了。\n\n「以新的法度重建。」\n\n新的章程下发到每一个工地与船坞，连同那些一向被视为禁脔的精锐编制——火枪手、方阵、武士、八旗、东印度商船——也被重新划定了名额。消息传开，各国使节连夜抄录。"
 lcs.3.a:0 "推行新法。"
 lcs_1550_reform_modifier:0 "营造改革"
 desc_lcs_1550_reform_modifier:0 "发展成本 -20%\n建造时间 -70%\n建筑花费 -50%\n\n特殊兵种可占上限 +50%，可直接征召数量 +2：\n陆军：法兰西火枪手、西班牙方阵、日本武士、奇兹尔巴什、马穆鲁克、陆战队、八旗、射击军、卡瓦、骠骑兵\n海军：荷兰东印度商船、龟船、战舰、盖伦帆船、桨帆炮船、卡拉维尔帆船\n\nAI 同样获得此修正，特殊兵种可征召数量随之上调。"
